<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WillyCartoons — AI Cartoon Studio</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#0b0b12;
  color:#fff;
  min-height:100vh;
}

header{
  padding:22px 7%;
  border-bottom:1px solid #292936;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:28px;
  font-weight:800;
}

.logo span{color:#7c5cff}

nav a{
  color:#ccc;
  text-decoration:none;
  margin-left:25px;
}

.hero{
  text-align:center;
  padding:80px 20px 50px;
}

.hero h1{
  font-size:52px;
  margin-bottom:18px;
}

.hero h1 span{color:#7c5cff}

.hero p{
  color:#aaa;
  font-size:19px;
  max-width:650px;
  margin:auto;
  line-height:1.6;
}

.container{
  max-width:1000px;
  margin:0 auto;
  padding:20px;
}

.upload-box{
  background:#15151f;
  border:1px solid #303040;
  border-radius:20px;
  padding:35px;
  text-align:center;
  box-shadow:0 15px 50px rgba(0,0,0,.3);
}

.upload-box h2{
  margin-bottom:10px;
}

.upload-box p{
  color:#999;
  margin-bottom:25px;
}

input[type=file]{
  display:none;
}

.upload-button{
  display:inline-block;
  padding:15px 28px;
  background:#7c5cff;
  border-radius:10px;
  cursor:pointer;
  font-weight:bold;
}

.upload-button:hover{
  background:#6948f0;
}

#status{
  margin-top:20px;
  color:#aaa;
}

#gallery{
  margin-top:40px;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:20px;
}

.video-card{
  background:#15151f;
  border:1px solid #303040;
  border-radius:15px;
  overflow:hidden;
}

.video-card video{
  width:100%;
  display:block;
  background:#000;
}

.video-card .info{
  padding:15px;
}

.video-card a{
  color:#9b84ff;
  text-decoration:none;
}

footer{
  text-align:center;
  padding:50px 20px;
  color:#777;
}
</style>
</head>

<body>

<header>
  <div class="logo">
  <img src="logo.png" alt="WillyCartoons">
</div>

  <nav>
    <a href="#upload">Upload</a>
    <a href="#videos">Videos</a>
  </nav>
</header>

<section class="hero">
  <h1>Welcome to <span>WillyCartoons</span></h1>
  <p>
    Create and share amazing cartoon videos from your photos,
    videos and ideas.
  </p>
</section>

<div class="container">

<section class="upload-box" id="upload">

  <h2>Upload Your Cartoon Video</h2>

  <p>
    Select an MP4, MOV or WebM video to publish on WillyCartoons.
  </p>

  <label class="upload-button" for="videoFile">
    Choose Video
  </label>

  <input
    id="videoFile"
    type="file"
    accept="video/mp4,video/webm,video/quicktime"
  >

  <div id="status">
    No video selected.
  </div>

</section>

<section id="videos">

  <h2 style="margin-top:50px;margin-bottom:20px">
    Latest Videos
  </h2>

  <div id="gallery"></div>

</section>

</div>

<footer>
  © 2026 WillyCartoons — AI Cartoon Studio
</footer>

<script>

/*
  SUPABASE CONNECTION
  Replace these two values with your Supabase project details.
*/

const SUPABASE_URL = "YOUR_SUPABASE_URL";
const SUPABASE_ANON_KEY = "sb_publishable_oRgJlR10J04T2xhFMQgsnw_bk67eqfj";

const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );

const BUCKET = "videos";

const fileInput = document.getElementById("videoFile");
const statusBox = document.getElementById("status");
const gallery = document.getElementById("gallery");

fileInput.addEventListener("change", async function(){

  const file = this.files[0];

  if(!file){
    return;
  }

  if(!file.type.startsWith("video/")){
    statusBox.textContent = "Please select a video file.";
    return;
  }

  statusBox.textContent =
    "Uploading " + file.name + "...";

  const safeName =
    file.name.replace(/[^a-zA-Z0-9._-]/g,"_");

  const filePath =
    Date.now() + "_" + safeName;

  const { data, error } =
    await supabaseClient
      .storage
      .from(BUCKET)
      .upload(filePath,file,{
        contentType:file.type,
        upsert:false
      });

  if(error){

    console.error(error);

    statusBox.textContent =
      "Upload failed: " + error.message;

    return;
  }

  const { data:urlData } =
    supabaseClient
      .storage
      .from(BUCKET)
      .getPublicUrl(filePath);

  const videoUrl = urlData.publicUrl;

  statusBox.textContent =
    "Video uploaded successfully!";

  addVideo(videoUrl,file.name);

  fileInput.value = "";

});

function addVideo(url,name){

  const card =
    document.createElement("div");

  card.className = "video-card";

  card.innerHTML = `
    <video controls preload="metadata">
      <source src="${url}">
    </video>

    <div class="info">
      <strong>${escapeHtml(name)}</strong>
      <br><br>
      <a href="${url}" target="_blank">
        Open video
      </a>
    </div>
  `;

  gallery.prepend(card);
}

function escapeHtml(text){

  const div =
    document.createElement("div");

  div.textContent = text;

  return div.innerHTML;
}

</script>

</body>
</html>
